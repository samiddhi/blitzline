# Copy this file, choose a model available in your account, and set its key.
# Paths are relative to this TOML file. Secrets belong in environment variables.

[run]
proofread = false
translate = true
allow_partial = false
# output_dir = "../.runs"

[asr]
backend = "local" # local, modal, http; see transcription.md.
executable = "whisperx" # May be an absolute executable in a separate environment.
model = "small"
device = "cpu"
compute_type = "int8"
# language = "sl" # Normally mapped from --language slv; set for other packs.
relisten = false # Uses the selected backend for uncertain proofreading cues.
# modal_app = "blitzline-asr"
# modal_function = "transcribe"
# modal_environment = "production"
# endpoint = "https://your-worker.example/transcribe" # HTTP worker contract.
# api_key_env = "TRANSCRIPTION_API_KEY" # HTTP bearer key, never the key itself.
# remote_compute_type = "float16"
# chunk_seconds = 600
# timeout = 7200
# retries = 2
# Decoding settings can be supplied in an [asr.options] table.
max_cue_ms = 8000
line_length = 42
pause_ms = 800
max_chars_per_second = 25 # Report fast cues without changing source text/timing.

[blitzer]
# Use a Blitzer executable whose `blitz --help` lists the two skip-file options.
executable = "bltzr"
# Blitzer normally reads ~/.config/bltzr/bltzr.toml (XDG config takes priority).
# Its [languages.CODE] sections can select different lists for each language.
# config = "bltzr.toml" # A separate Blitzer config; path relative to this file.
# plugins_dir = "language-packs"
# Optional overrides below apply to every language run with this Blitzline config.
# Each names ONE file containing one word per line. Use either list or both.
# Omit an override to use the corresponding file from Blitzer's language settings.
# For multiple languages, prefer putting the lists in Blitzer's config instead.
#
# Skip only these EXACT WORDS (word form).
# For "to be", listing "be" and "am" leaves "is", "are", "was", "were",
# "being", and "been" counted. Listing "cat" leaves "cats" counted.
# Slovenian example: listing "sem" and "biti" leaves "sva" counted.
# skip_exact_words_file = "slv-exact-words.txt"
#
# Skip these WORD FAMILIES (lexeme/lemma), using the dictionary.
# For "to be", list "be" (without "to") to skip "be", "am", "is", "are",
# "was", "were", "being", and "been". Listing "cat" skips "cat" and "cats".
# Write basic words here. Families depend on dictionary coverage; bundled English
# currently lacks some "to be" links. List all eight exact words to skip them all
# with that dictionary. For Slovenian, the "biti" family includes "sem" and "sva".
# skip_word_families_file = "slv-word-families.txt"
#
# Blitzline reads these files but never adds words to them or saves Blitzer history.
# It shows basic words on cards; this does not change what either list skips.
# true bypasses Blitzer's user config; explicit overrides above still apply.
no_config = false

[llm]
default = "router"
# proofread = "router"
# translate = "direct-deepseek"
# review = "router"
batch_size = 20
max_chars = 24000
repair_attempts = 2

[profiles.router]
provider = "openrouter"
model = "deepseek/deepseek-chat" # Example ID; select an available model in your account.
api_key_env = "OPENROUTER_API_KEY"
response_format = "json_object" # json_schema for supported models; text omits enforcement.
max_tokens = 4096
timeout = 120
retries = 2
# referer = "https://your-app.example" # Optional OpenRouter app attribution.

# Other choices; uncomment a profile and select it above.
# [profiles.direct-deepseek]
# provider = "deepseek"
# model = "YOUR_DEEPSEEK_MODEL_ID"
# api_key_env = "DEEPSEEK_API_KEY"
# response_format = "json_object"

# [profiles.local]
# provider = "compatible"
# base_url = "http://127.0.0.1:1234/v1"
# model = "YOUR_LOCAL_MODEL_ID"
# api_key_env = "LOCAL_LLM_KEY" # Set a nonempty placeholder if your server ignores keys.
# response_format = "text" # Blitzline still parses and validates JSON locally.

[media]
kind = "audio" # video creates H.264/AAC MP4; input must have a video stream.
padding_ms = 200
max_clip_ms = 45000
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
audio_codec = "libmp3lame"
video_codec = "libx264"

[export]
format = "tsv" # tsv, apkg (install the apkg extra), anki (AnkiConnect required).
deck = "Blitzline"
model = "Blitzer Basic"
preset = "blitzer" # Default matches ref/example_note.apkg; legacy uses old fields.
two_way = false # Enable translation -> typed-word Recall cards.
update_model = false # Explicitly update matching live Anki templates/CSS.
tags = ["blitzline"]
# css_file = "anki/style.css"
# assets = ["anki/picture.png"]
# Ordered fields and multiple templates are customizable; see anki.md.
anki_url = "http://127.0.0.1:8765"
existing = "skip" # update replaces Blitzline fields without changing scheduling.
# front_template = "{{Word}}<br>{{Sentence1}}<br>{{Sentence1 Audio}}"
# back_template = "{{FrontSide}}<hr id=answer>{{Translation}}<br>{{Sentence2}}<br>{{Sentence2 Audio}}<br>{{Comments}}"
# css = ".card { font-family: sans-serif; font-size: 22px; }"

# Explicitly associate each destination deck with its source language and cards.
# Add/edit profiles for every language you study. --deck-profile selects one;
# --language selects its single matching profile. The example note type is inherited.
[decks.slovenian]
language = "slv"
deck = "Blitzline::Slovenian"
card_types = ["Sentence1", "Sentence2"]

[decks.polish]
language = "pol"
deck = "Blitzline::Polish"
card_types = ["Recall", "Sentence1", "Sentence2"] # Selecting Recall enables it.
# model = "My Polish note type" # Default: inherited model name plus [polish].
# css_file = "anki/polish.css"
