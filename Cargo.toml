[workspace]
members = ["crates/domain", "crates/engine", "crates/adapters", "apps/cli", "apps/desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
blitzline-domain = { path = "crates/domain" }
blitzline-engine = { path = "crates/engine" }
blitzline-adapters = { path = "crates/adapters" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"

[profile.dev]
debug = 1

