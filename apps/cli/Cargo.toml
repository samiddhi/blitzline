[package]
name = "blitzline-cli"
default-run = "blitzline"
version.workspace = true
edition.workspace = true

[[bin]]
name = "blitzline"
path = "src/main.rs"

[dependencies]
blitzline-domain.workspace = true
blitzline-engine.workspace = true
blitzline-adapters.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
ctrlc = "3"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "blitzline-demo"
path = "src/demo.rs"

[features]
test-tools = []

[[bin]]
name = "blitzline-contract-fixture"
path = "tests/support/native_tool.rs"
required-features = ["test-tools"]
