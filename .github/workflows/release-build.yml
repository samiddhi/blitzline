name: Build native distribution artifacts
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev pkg-config
      - run: cargo build --release --locked -p blitzline-cli -p blitzline-desktop --bin blitzline --bin blitzline-desktop
      - if: runner.os == 'macOS'
        run: sh distribution/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: blitzline-${{ runner.os }}-${{ runner.arch }}-unsigned
          path: |
            target/release/blitzline
            target/release/blitzline.exe
            target/release/blitzline-desktop
            target/release/blitzline-desktop.exe
            distribution/CLI-README.md
          if-no-files-found: error
      - if: runner.os == 'macOS'
        run: ditto -c -k --keepParent target/Blitzline.app target/Blitzline-macOS.zip
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Blitzline-macOS-app-unsigned
          path: target/Blitzline-macOS.zip
