[package]
name = "blitzline-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
blitzline-domain.workspace = true
blitzline-engine.workspace = true
blitzline-adapters.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11", "__screenshot"] }
rfd = "0.15"
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSAppearance", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSToolbar", "NSToolbarItem", "NSView", "NSWindow"] }

[dev-dependencies]
egui_kittest = "0.33.3"
tempfile.workspace = true
